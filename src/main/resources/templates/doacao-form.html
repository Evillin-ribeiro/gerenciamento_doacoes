<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova Doação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <h2 class="mb-4">Sua doação</h2>

            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

            <form th:action="@{/doacoes/novo}" th:object="${doacaoForm}" method="post" id="formDoacao">
                <input type="hidden" th:field="*{doadorId}">

                <div class="mb-3">
                    <label class="form-label">Tipo de doação</label>
                    <select class="form-select" th:field="*{tipo}" id="tipoSelect" required>
                        <option value="">Selecione...</option>
                        <option value="ALIMENTO">Alimento</option>
                        <option value="ROUPA">Roupa</option>
                        <option value="ITEM_DIVERSO">Item diverso</option>
                        <option value="FINANCEIRA">Doação financeira</option>
                    </select>
                </div>

                <div id="secaoItens">
                    <p class="text-muted">Escolha até 3 itens do nosso catálogo.</p>
                    <div class="row mb-2" th:each="i : ${#numbers.sequence(1,3)}">
                        <div class="col-12 col-sm-8">
                            <select class="form-select item-select" th:name="'estoqueId' + ${i}">
                                <option value="">-- item --</option>
                                <option th:each="item : ${itensEstoque}" th:value="${item.id()}"
                                        th:attr="data-categoria=${item.categoria()}"
                                        th:text="${item.descricaoItem() + ' (' + item.unidadeMedida() + ')'}"></option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-4 mt-2 mt-sm-0">
                            <input type="number" step="0.001" min="0" class="form-control"
                                   th:name="'quantidade' + ${i}" placeholder="Quantidade">
                        </div>
                    </div>

                    <p class="text-muted mt-3 mb-1">Não achou o item na lista? Digite abaixo.</p>
                    <div class="row mb-2">
                        <div class="col-12 col-sm-8">
                            <input type="text" class="form-control" th:field="*{outroItemNome}"
                                   placeholder="Nome do item" maxlength="255">
                        </div>
                        <div class="col-12 col-sm-4 mt-2 mt-sm-0">
                            <input type="number" step="0.001" min="0" class="form-control"
                                   th:field="*{outroItemQuantidade}" placeholder="Quantidade">
                        </div>
                    </div>
                    <p class="text-muted small">Esse item será registrado para controle como "item diverso".</p>
                </div>

                <div id="secaoValor" class="mb-3" style="display:none;">
                    <label class="form-label">Valor (R$)</label>
                    <input type="number" step="0.01" min="0" class="form-control" th:field="*{valor}">
                </div>

                <button type="submit" class="btn btn-azul">Confirmar doação</button>
            </form>
        </div>
    </div>
</main>

<script th:inline="javascript">
    const tipoSelect = document.getElementById('tipoSelect');
    const secaoItens = document.getElementById('secaoItens');
    const secaoValor = document.getElementById('secaoValor');
    const itemSelects = document.querySelectorAll('.item-select');

    function atualizarSecoes() {
        if (tipoSelect.value === 'FINANCEIRA') {
            secaoItens.style.display = 'none';
            secaoValor.style.display = 'block';
        } else {
            secaoItens.style.display = 'block';
            secaoValor.style.display = 'none';
        }
    }

    // Para ALIMENTO/ROUPA, mostra so os itens do catalogo daquela categoria.
    // Para ITEM_DIVERSO (ou nenhum tipo ainda selecionado), mostra o catalogo inteiro.
    function filtrarItensPorTipo() {
        const tipo = tipoSelect.value;
        const filtrar = tipo === 'ALIMENTO' || tipo === 'ROUPA';

        itemSelects.forEach(function (select) {
            let valorSelecionadoAindaValido = false;
            select.querySelectorAll('option').forEach(function (option) {
                if (!option.value) {
                    return;
                }
                const visivel = !filtrar || option.getAttribute('data-categoria') === tipo;
                option.hidden = !visivel;
                option.disabled = !visivel;
                if (visivel && option.selected) {
                    valorSelecionadoAindaValido = true;
                }
            });
            if (!valorSelecionadoAindaValido) {
                select.value = '';
            }
        });
    }

    tipoSelect.addEventListener('change', function () {
        atualizarSecoes();
        filtrarItensPorTipo();
    });
    atualizarSecoes();
    filtrarItensPorTipo();
</script>
</body>
</html>
