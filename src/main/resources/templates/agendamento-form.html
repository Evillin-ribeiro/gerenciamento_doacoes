<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agendar Entrega</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4">Agendar entrega presencial</h2>

            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
            <div id="erroJs" class="alert alert-danger" style="display:none;"></div>

            <form th:action="@{/agendamentos/novo}" th:object="${agendamentoForm}" method="post">
                <input type="hidden" th:field="*{doacaoId}">

                <div class="mb-3">
                    <label class="form-label">Data desejada</label>
                    <input type="date" class="form-control" id="dataEntrega" th:field="*{dataEntrega}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Horários disponíveis</label>
                    <div id="listaHorarios" class="form-text">Escolha uma data para ver os horários.</div>
                </div>

                <button type="submit" class="btn btn-azul" id="btnConfirmar" disabled>Confirmar agendamento</button>
            </form>
        </div>
    </div>
</main>

<script th:inline="javascript">
    const inputData = document.getElementById('dataEntrega');
    const listaHorarios = document.getElementById('listaHorarios');
    const btnConfirmar = document.getElementById('btnConfirmar');
    const erroJs = document.getElementById('erroJs');

    inputData.addEventListener('change', function () {
        listaHorarios.innerHTML = 'Carregando...';
        btnConfirmar.disabled = true;
        erroJs.style.display = 'none';

        fetch('/api/agendamentos/disponibilidade?data=' + inputData.value)
            .then(function (resp) {
                if (!resp.ok) { throw new Error('Falha ao consultar disponibilidade'); }
                return resp.json();
            })
            .then(function (horarios) {
                if (horarios.length === 0) {
                    listaHorarios.innerHTML = 'Nenhum horário de atendimento configurado para este dia da semana.';
                    return;
                }
                listaHorarios.innerHTML = '';
                horarios.forEach(function (h) {
                    const div = document.createElement('div');
                    div.className = 'form-check';
                    const disabled = h.vagasDisponiveis <= 0 ? 'disabled' : '';
                    div.innerHTML = '<input class="form-check-input" type="radio" name="horarioAtendimentoId" value="' + h.horarioAtendimentoId + '" ' + disabled + '>' +
                        '<label class="form-check-label">' + h.horaInicio + ' - ' + h.horaFim + ' (' + h.vagasDisponiveis + ' vaga(s))</label>';
                    listaHorarios.appendChild(div);
                });
                listaHorarios.querySelectorAll('input[type=radio]').forEach(function (radio) {
                    radio.addEventListener('change', function () { btnConfirmar.disabled = false; });
                });
            })
            .catch(function () {
                erroJs.textContent = 'Nao foi possivel consultar os horarios disponiveis.';
                erroJs.style.display = 'block';
            });
    });
</script>
</body>
</html>
