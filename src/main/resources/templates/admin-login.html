<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Painel Administrativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h2 class="mb-4">Login para Administração </h2>

            <div id="erroLogin" class="alert alert-danger" style="display:none;"></div>

            <form id="formLogin">
                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" required>
                </div>
                <button type="submit" class="btn btn-azul">Entrar</button>
            </form>
        </div>
    </div>
</main>

<script src="/js/admin.js"></script>
<script>
    document.getElementById('formLogin').addEventListener('submit', function (ev) {
        ev.preventDefault();
        const erroLogin = document.getElementById('erroLogin');
        erroLogin.style.display = 'none';

        fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value
            })
        })
            .then(function (resp) {
                if (!resp.ok) { throw new Error('Email ou senha invalidos'); }
                return resp.json();
            })
            .then(function (data) {
                sessionStorage.setItem('token', data.token);
                sessionStorage.setItem('usuarioId', data.usuarioId);
                sessionStorage.setItem('nome', data.nome);
                sessionStorage.setItem('role', data.role);
                window.location.href = '/admin';
            })
            .catch(function (err) {
                erroLogin.textContent = err.message;
                erroLogin.style.display = 'block';
            });
    });
</script>
</body>
</html>
