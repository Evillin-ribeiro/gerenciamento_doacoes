<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enviar Comprovante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4">Enviar comprovante do Pix</h2>

            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

            <form th:action="@{/doacoes/{id}/comprovante(id=${doacaoId})}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Arquivo (JPEG, PNG ou PDF, até 5MB)</label>
                    <input type="file" class="form-control" name="arquivo" accept=".jpg,.jpeg,.png,.pdf" required>
                </div>
                <button type="submit" class="btn btn-azul">Enviar</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
