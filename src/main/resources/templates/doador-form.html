<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar Doador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4">Seus dados</h2>

            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

            <form th:action="@{/doadores/novo}" th:object="${doadorForm}" method="post">
                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-control" th:field="*{nome}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" th:field="*{email}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Telefone</label>
                    <input type="text" class="form-control" th:field="*{telefone}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Cidade - Estado </label>
                    <input type="text" class="form-control" th:field="*{endereco}">
                </div>
                <button type="submit" class="btn btn-azul">Continuar</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
