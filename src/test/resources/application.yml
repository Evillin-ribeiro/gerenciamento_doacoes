spring:
  datasource:
    url: "jdbc:h2:mem:testdb-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

uploads:
  comprovantes-dir: ./target/test-uploads/comprovantes

jwt:
  secret: teste-secret-para-testes-de-integracao-nao-usar-em-producao-1234567890
  expiration-ms: 28800000
